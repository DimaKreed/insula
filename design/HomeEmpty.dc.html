<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Schibsted Grotesk', 'Segoe UI', system-ui, sans-serif; }
    a { color: oklch(0.5 0.08 205); text-decoration: none; }
    a:hover { color: oklch(0.42 0.08 205); }
    .light {
      --bg: oklch(0.975 0.006 85); --surface: oklch(0.995 0.003 90); --surface2: oklch(0.942 0.01 85);
      --ink: oklch(0.25 0.035 240); --ink2: oklch(0.46 0.025 235); --ink3: oklch(0.62 0.018 235);
      --line: oklch(0.905 0.012 85);
      --teal: oklch(0.5 0.08 205); --teal-soft: oklch(0.93 0.028 200);
      --sand: oklch(0.8 0.075 80); --sand-soft: oklch(0.934 0.038 85); --sand-ink: oklch(0.42 0.065 70);
      --green: oklch(0.55 0.09 165); --green-soft: oklch(0.93 0.03 165);
      --err: oklch(0.54 0.115 35); --err-soft: oklch(0.94 0.028 35);
      --primary: oklch(0.25 0.035 240); --on-primary: oklch(0.975 0.006 85);
      --shadow: 0 1px 3px oklch(0.25 0.035 240 / 0.08);
      --pop-shadow: 0 8px 24px oklch(0.25 0.035 240 / 0.16);
    }
    .dark {
      --bg: oklch(0.185 0.028 235); --surface: oklch(0.23 0.03 235); --surface2: oklch(0.278 0.032 235);
      --ink: oklch(0.945 0.01 90); --ink2: oklch(0.73 0.018 220); --ink3: oklch(0.55 0.022 225);
      --line: oklch(0.31 0.03 235);
      --teal: oklch(0.73 0.085 195); --teal-soft: oklch(0.29 0.042 210);
      --sand: oklch(0.83 0.078 82); --sand-soft: oklch(0.3 0.038 80); --sand-ink: oklch(0.87 0.055 85);
      --green: oklch(0.72 0.095 165); --green-soft: oklch(0.28 0.04 165);
      --err: oklch(0.7 0.105 35); --err-soft: oklch(0.3 0.045 30);
      --primary: oklch(0.83 0.078 82); --on-primary: oklch(0.2 0.03 235);
      --shadow: 0 1px 3px oklch(0 0 0 / 0.32);
      --pop-shadow: 0 8px 24px oklch(0 0 0 / 0.45);
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); position: relative; overflow: hidden;">
  <div style="padding: 64px 24px 0;">
    <div style="font-size: 28px; font-weight: 700; letter-spacing: -0.4px;">Islands</div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 0 32px;">
    <svg width="110" height="90" viewBox="0 0 110 90" fill="none" stroke="var(--ink3)" stroke-width="1.5" stroke-linecap="round">
      <path d="M30 52c0-16 11-28 25-28s25 12 25 28"></path>
      <path d="M38 52c0-11 7.5-19 17-19s17 8 17 19"></path>
      <path d="M46 52c0-6 4-10 9-10s9 4 9 10"></path>
      <path d="M10 66c5-4 10-4 15 0s10 4 15 0 10-4 15 0 10 4 15 0 10-4 15 0 10 4 15 0" stroke="var(--teal)"></path>
      <path d="M18 78c5-4 10-4 15 0s10 4 15 0 10-4 15 0 10 4 15 0 10-4 15 0" stroke="var(--teal)" opacity="0.5"></path>
    </svg>
    <div style="font-size: 22px; font-weight: 600; letter-spacing: -0.3px; text-align: center;">Build your first island</div>
    <div style="display: flex; flex-direction: column; gap: 14px; align-self: stretch;">
      <div style="display: flex; gap: 12px; align-items: baseline;">
        <span style="font-family: 'Newsreader', Georgia, serif; font-size: 15px; color: var(--sand-ink); min-width: 14px;">1</span>
        <span style="font-size: 15px; color: var(--ink2); line-height: 1.5;">Capture sentences from your day — in English.</span>
      </div>
      <div style="display: flex; gap: 12px; align-items: baseline;">
        <span style="font-family: 'Newsreader', Georgia, serif; font-size: 15px; color: var(--sand-ink); min-width: 14px;">2</span>
        <span style="font-size: 15px; color: var(--ink2); line-height: 1.5;">Insula translates them into Romanian, with natural audio.</span>
      </div>
      <div style="display: flex; gap: 12px; align-items: baseline;">
        <span style="font-family: 'Newsreader', Georgia, serif; font-size: 15px; color: var(--sand-ink); min-width: 14px;">3</span>
        <span style="font-size: 15px; color: var(--ink2); line-height: 1.5;">Listen on your commute, recall daily — speak in weeks.</span>
      </div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 24px 20px;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; background: var(--primary); color: var(--on-primary); border-radius: 14px; font-size: 15px; font-weight: 600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <span>Create your first island</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; color: var(--teal); font-size: 14.5px; font-weight: 600;">
      <span>Or start from a preset island</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"></line><polyline points="13 5 20 12 13 19"></polyline></svg>
    </div>
  </div>
  <div style="display: flex; align-items: stretch; border-top: 1px solid var(--line); background: var(--surface); padding: 8px 8px 20px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--teal);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15c0-4 2.2-7 5-7s5 3 5 7"></path><path d="M3 19c1.5-1.3 3-1.3 4.5 0s3 1.3 4.5 0 3-1.3 4.5 0 3 1.3 4.5 0"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600;">Islands</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--ink3);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
      <span style="font-size: 10.5px; font-weight: 500;">Review</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--ink3);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5"></path><path d="m3 13 9 5 9-5"></path></svg>
      <span style="font-size: 10.5px; font-weight: 500;">Presets</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--ink3);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path><line x1="9" y1="13" x2="15" y2="13"></line><line x1="9" y1="17" x2="13" y2="17"></line></svg>
      <span style="font-size: 10.5px; font-weight: 500;">Transcripts</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--ink3);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="4" x2="6" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line><line x1="18" y1="4" x2="18" y2="20"></line><line x1="4" y1="9" x2="8" y2="9"></line><line x1="10" y1="15" x2="14" y2="15"></line><line x1="16" y1="7" x2="20" y2="7"></line></svg>
      <span style="font-size: 10.5px; font-weight: 500;">Settings</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>

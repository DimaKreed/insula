<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Schibsted Grotesk', 'Segoe UI', system-ui, sans-serif; }
    a { color: oklch(0.5 0.08 205); text-decoration: none; }
    a:hover { color: oklch(0.42 0.08 205); }
    .light {
      --bg: oklch(0.975 0.006 85); --surface: oklch(0.995 0.003 90); --surface2: oklch(0.942 0.01 85);
      --ink: oklch(0.25 0.035 240); --ink2: oklch(0.46 0.025 235); --ink3: oklch(0.62 0.018 235);
      --line: oklch(0.905 0.012 85);
      --teal: oklch(0.5 0.08 205); --teal-soft: oklch(0.93 0.028 200);
      --sand: oklch(0.8 0.075 80); --sand-soft: oklch(0.934 0.038 85); --sand-ink: oklch(0.42 0.065 70);
      --green: oklch(0.55 0.09 165); --green-soft: oklch(0.93 0.03 165);
      --err: oklch(0.54 0.115 35); --err-soft: oklch(0.94 0.028 35);
      --primary: oklch(0.25 0.035 240); --on-primary: oklch(0.975 0.006 85);
      --shadow: 0 1px 3px oklch(0.25 0.035 240 / 0.08);
      --pop-shadow: 0 8px 24px oklch(0.25 0.035 240 / 0.16);
    }
    .dark {
      --bg: oklch(0.185 0.028 235); --surface: oklch(0.23 0.03 235); --surface2: oklch(0.278 0.032 235);
      --ink: oklch(0.945 0.01 90); --ink2: oklch(0.73 0.018 220); --ink3: oklch(0.55 0.022 225);
      --line: oklch(0.31 0.03 235);
      --teal: oklch(0.73 0.085 195); --teal-soft: oklch(0.29 0.042 210);
      --sand: oklch(0.83 0.078 82); --sand-soft: oklch(0.3 0.038 80); --sand-ink: oklch(0.87 0.055 85);
      --green: oklch(0.72 0.095 165); --green-soft: oklch(0.28 0.04 165);
      --err: oklch(0.7 0.105 35); --err-soft: oklch(0.3 0.045 30);
      --primary: oklch(0.83 0.078 82); --on-primary: oklch(0.2 0.03 235);
      --shadow: 0 1px 3px oklch(0 0 0 / 0.32);
      --pop-shadow: 0 8px 24px oklch(0 0 0 / 0.45);
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); position: relative; overflow: hidden;">
  <div style="display: flex; align-items: center; gap: 10px; padding: 54px 20px 6px;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -12px; color: var(--ink2);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 15.5px; font-weight: 600;">Interviu — Andra despre maraton</span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 0 40px;">
    <svg width="72" height="40" viewBox="0 0 72 40" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round">
      <path d="M4 24c4-6 8-6 12 0s8 6 12 0 8-6 12 0 8 6 12 0 8-6 12 0" style="animation: pulse 1.6s infinite;"></path>
      <path d="M10 34c4-5 7-5 11 0s7 5 11 0 7-5 11 0 7 5 11 0" opacity="0.4" style="animation: pulse 1.6s infinite 0.4s;"></path>
    </svg>
    <div style="font-size: 22px; font-weight: 600; letter-spacing: -0.3px;">Analyzing your transcript</div>
    <div style="display: flex; flex-direction: column; gap: 16px; align-self: stretch; padding: 0 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: var(--green-soft); border-radius: 99px; color: var(--green);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
        </div>
        <span style="font-size: 14.5px; color: var(--ink2);">Vocabulary extracted — 363 words</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: var(--teal-soft); border-radius: 99px;">
          <span style="width: 8px; height: 8px; background: var(--teal); border-radius: 99px; animation: pulse 1.4s infinite;"></span>
        </div>
        <span style="font-size: 14.5px; font-weight: 600;">Comparing with words you know</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--line); border-radius: 99px;"></div>
        <span style="font-size: 14.5px; color: var(--ink3);">Preparing your study list</span>
      </div>
    </div>
    <div style="font-size: 13px; color: var(--ink3); text-align: center;">Usually under a minute — you can leave this screen.</div>
  </div>
  <div style="height: 90px;"></div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Schibsted Grotesk', 'Segoe UI', system-ui, sans-serif; }
    a { color: oklch(0.5 0.08 205); text-decoration: none; }
    a:hover { color: oklch(0.42 0.08 205); }
    .light {
      --bg: oklch(0.975 0.006 85); --surface: oklch(0.995 0.003 90); --surface2: oklch(0.942 0.01 85);
      --ink: oklch(0.25 0.035 240); --ink2: oklch(0.46 0.025 235); --ink3: oklch(0.62 0.018 235);
      --line: oklch(0.905 0.012 85);
      --teal: oklch(0.5 0.08 205); --teal-soft: oklch(0.93 0.028 200);
      --sand: oklch(0.8 0.075 80); --sand-soft: oklch(0.934 0.038 85); --sand-ink: oklch(0.42 0.065 70); --on-sand: oklch(0.28 0.05 60);
      --green: oklch(0.55 0.09 165); --green-soft: oklch(0.93 0.03 165);
      --err: oklch(0.54 0.115 35); --err-soft: oklch(0.94 0.028 35);
      --primary: oklch(0.25 0.035 240); --on-primary: oklch(0.975 0.006 85);
      --shadow: 0 1px 3px oklch(0.25 0.035 240 / 0.08);
      --pop-shadow: 0 8px 24px oklch(0.25 0.035 240 / 0.16);
    }
    .dark {
      --bg: oklch(0.185 0.028 235); --surface: oklch(0.23 0.03 235); --surface2: oklch(0.278 0.032 235);
      --ink: oklch(0.945 0.01 90); --ink2: oklch(0.73 0.018 220); --ink3: oklch(0.55 0.022 225);
      --line: oklch(0.31 0.03 235);
      --teal: oklch(0.73 0.085 195); --teal-soft: oklch(0.29 0.042 210);
      --sand: oklch(0.83 0.078 82); --sand-soft: oklch(0.3 0.038 80); --sand-ink: oklch(0.87 0.055 85); --on-sand: oklch(0.28 0.05 60);
      --green: oklch(0.72 0.095 165); --green-soft: oklch(0.28 0.04 165);
      --err: oklch(0.7 0.105 35); --err-soft: oklch(0.3 0.045 30);
      --primary: oklch(0.83 0.078 82); --on-primary: oklch(0.2 0.03 235);
      --shadow: 0 1px 3px oklch(0 0 0 / 0.32);
      --pop-shadow: 0 8px 24px oklch(0 0 0 / 0.45);
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); position: relative; overflow: hidden;">
  <svg width="390" height="360" viewBox="0 0 390 360" fill="none" style="position: absolute; top: 40px; left: 0; opacity: 0.45;">
    <path d="M-30 300C50 240 140 215 230 240s150 85 190 60" stroke="var(--line)" stroke-width="1.5"></path>
    <path d="M-30 260C60 195 160 170 250 200s130 95 170 75" stroke="var(--line)" stroke-width="1.5"></path>
    <path d="M-30 220C70 150 180 130 270 165s110 100 150 85" stroke="var(--line)" stroke-width="1.5"></path>
  </svg>
  <div style="display: flex; align-items: center; padding: 54px 20px 8px; position: relative;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -12px; color: var(--ink2);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 15px; font-weight: 600;">
      <span>💼</span>
      <span>Work</span>
    </div>
    <div style="display: flex; align-items: center; gap: 5px; padding: 5px 10px; background: var(--teal-soft); color: var(--teal); border-radius: 99px; font-size: 11.5px; font-weight: 600;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12.5 2.5 2.5 4.5-5"></path></svg>
      <span>Offline</span>
    </div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 30px; position: relative; text-align: center;">
    <div style="font-family: 'Newsreader', Georgia, 'Times New Roman', serif; font-size: 31px; font-weight: 500; line-height: 1.3; letter-spacing: -0.2px;">Ședința asta ar fi putut fi un e-mail.</div>
    <div style="font-size: 15px; color: var(--ink3); line-height: 1.5;">This meeting could have been an email.</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 7px; padding: 0 24px 18px; position: relative;">
    <div style="height: 4px; background: var(--surface2); border-radius: 99px; position: relative;">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 43%; background: var(--sand); border-radius: 99px;"></div>
    </div>
    <div style="font-size: 12px; color: var(--ink3); text-align: center;">Sentence 18 of 42</div>
  </div>
  <div style="margin: 0 20px 12px; display: flex; background: var(--surface2); border-radius: 13px; padding: 4px; position: relative;">
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--ink3);">Listen</div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--ink3);">Loop one</div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; height: 40px; background: var(--surface); border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--ink); box-shadow: var(--shadow);">Shadow</div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--ink3);">Recall</div>
  </div>
  <div style="margin: 0 20px 26px; display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 1px;">
      <span style="font-size: 13.5px; font-weight: 600;">Shadow gap</span>
      <span style="font-size: 11.5px; color: var(--ink3);">Pause after each sentence — repeat aloud</span>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 99px; color: var(--ink2); font-size: 20px; font-weight: 500;">−</div>
    <div style="min-width: 44px; text-align: center; font-size: 15px; font-weight: 700;">1.5×</div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 99px; color: var(--ink2); font-size: 20px; font-weight: 500;">+</div>
  </div>
  <div style="display: flex; align-items: center; justify-content: center; gap: 30px; padding: 0 24px 56px; position: relative;">
    <div style="width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; background: var(--surface2); border-radius: 99px; color: var(--ink);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
    </div>
    <div style="width: 92px; height: 92px; display: flex; align-items: center; justify-content: center; background: var(--sand); border-radius: 99px; color: var(--on-sand); box-shadow: var(--pop-shadow);">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="9" y1="5" x2="9" y2="19"></line><line x1="15" y1="5" x2="15" y2="19"></line></svg>
    </div>
    <div style="width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; background: var(--surface2); border-radius: 99px; color: var(--ink);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: (this.props.dark ?? true) ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
